spring:
  profiles:
    active: upen

logging:
  level:
    root: INFO
    com.slokam.av: ${APP_LOG_LEVEL:INFO}

# Generated from controller signatures, Jackson models and validation constraints.
springdoc:
  packages-to-scan: com.slokam.av.controller
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:1439956405860947}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  api-version: ${WHATSAPP_API_VERSION:v25.0}
  template-name: ${WHATSAPP_OTP_TEMPLATE:otp}
  template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
